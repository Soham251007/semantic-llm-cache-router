version: '3.8'

services:
  # 1. High-Concurrency Go Reverse Proxy & LLM Control Plane
  gateway:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.gateway
    container_name: llm-cache-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ML_SERVICE_URL=http://ml-service:8001
      - CACHE_BACKEND=redis
      - REDIS_URL=redis://redis:6379
      - SIMILARITY_THRESHOLD=0.94
      - COMPLEXITY_ALPHA=0.45
      - UPSTREAM_PROVIDER=simulator
      - TIER1_MODEL=gpt-4o-mini
      - TIER2_MODEL=gpt-4o
      - CACHE_TTL_SECONDS=86400
      - ENABLE_METRICS=true
      - SIMULATE_LATENCY=true
    depends_on:
      ml-service:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 2. Python ML Microservice (ONNX Runtime INT8 MiniLM + DistilBERT)
  ml-service:
    build:
      context: ../services/ml_service
      dockerfile: Dockerfile
    container_name: llm-ml-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - ML_PORT=8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # 3. Redis Stack with Vector Similarity Search (RediSearch / HNSW)
  redis:
    image: redis/redis-stack-server:latest
    container_name: llm-redis-stack
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 4. Prometheus Metrics & Observability
  prometheus:
    image: prom/prometheus:latest
    container_name: llm-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
